<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300">

  <defs>
    <style>
      .pixel {
        shape-rendering: crispEdges;
      }

      .title {
        font-family: monospace;
        font-size: 48px;
        fill: #FFD54F;
        font-weight: bold;
      }

      .subtitle {
        font-family: monospace;
        font-size: 20px;
        fill: #E0E0E0;
      }

      .panel-text {
        font-family: monospace;
        font-size: 14px;
        fill: #E0E0E0;
      }

      .arm {
        transform-origin: 165px 145px;
        animation: cook 1.2s infinite alternate;
      }

      .omelet {
        animation: flip 1.2s infinite;
      }

      .steam1 {
        animation: steam 2s infinite;
      }

      .steam2 {
        animation: steam 2s infinite .6s;
      }

      .steam3 {
        animation: steam 2s infinite 1.2s;
      }

      .grass1 {
        animation: toast 4s infinite;
      }

      .grass2 {
        animation: toast 4s infinite 1s;
      }

      .grass3 {
        animation: toast 4s infinite 2s;
      }

      @keyframes cook {
        from { transform: rotate(-6deg); }
        to   { transform: rotate(10deg); }
      }

      @keyframes flip {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-35px);
        }
        100% {
          transform: translateY(0);
        }
      }

      @keyframes steam {
        0% {
          opacity: 0;
          transform: translateY(0);
        }

        50% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translateY(-25px);
        }
      }

      @keyframes toast {
        0%,55% {
          fill: #2ea043;
        }

        65%,100% {
          fill: #FFD54F;
        }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="#0d1117"/>

  <!-- stars -->
  <circle cx="60" cy="40" r="2" fill="#ffffff"/>
  <circle cx="250" cy="20" r="2" fill="#ffffff"/>
  <circle cx="900" cy="40" r="2" fill="#ffffff"/>
  <circle cx="1100" cy="60" r="2" fill="#ffffff"/>

  <!-- title -->
  <text x="420" y="95" class="title">
    TAMAGOYAKI
  </text>

  <text x="430" y="130" class="subtitle">
    Security Engineer | AppSec | AWS | Go
  </text>

  <!-- chef -->

  <!-- hat -->
  <rect x="80" y="78" width="60" height="14" fill="#ffffff"/>

  <!-- head -->
  <rect x="90" y="92" width="40" height="40" fill="#f0c7a0"/>

  <!-- body -->
  <rect x="85" y="132" width="50" height="55" fill="#58a6ff"/>

  <!-- legs -->
  <rect x="92" y="187" width="12" height="35" fill="#666"/>
  <rect x="116" y="187" width="12" height="35" fill="#666"/>

  <!-- arm -->
  <g class="arm">
    <rect x="130" y="140" width="80" height="10" fill="#f0c7a0"/>
  </g>

  <!-- stove -->
  <rect x="190" y="165" width="90" height="20" fill="#555"/>

  <!-- pan -->
  <ellipse cx="225" cy="150" rx="45" ry="12" fill="#2a2a2a"/>
  <rect x="260" y="147" width="35" height="6" fill="#707070"/>

  <!-- omelet -->
  <g class="omelet">
    <rect
      x="210"
      y="138"
      width="30"
      height="15"
      rx="3"
      fill="#FFD54F"/>
  </g>

  <!-- steam -->
  <rect class="steam1" x="215" y="110" width="4" height="15" fill="#ffffff"/>
  <rect class="steam2" x="228" y="100" width="4" height="15" fill="#ffffff"/>
  <rect class="steam3" x="242" y="110" width="4" height="15" fill="#ffffff"/>

  <!-- RPG Panel -->
  <rect
    x="400"
    y="165"
    width="320"
    height="90"
    rx="8"
    fill="#161b22"
    stroke="#30363d"/>

  <text x="425" y="190" class="panel-text">
    CLASS : SECURITY ENGINEER
  </text>

  <text x="425" y="210" class="panel-text">
    LV    : 99
  </text>

  <text x="425" y="230" class="panel-text">
    MAIN  : APPSEC
  </text>

  <text x="425" y="250" class="panel-text">
    WEAPON: FRYING PAN + BURP
  </text>

  <!-- contribution grid -->
  <g transform="translate(900,90)">

    <rect class="grass1" x="0" y="0" width="20" height="20"/>
    <rect class="grass2" x="25" y="0" width="20" height="20"/>
    <rect class="grass3" x="50" y="0" width="20" height="20"/>
    <rect class="grass1" x="75" y="0" width="20" height="20"/>

    <rect class="grass2" x="0" y="25" width="20" height="20"/>
    <rect class="grass3" x="25" y="25" width="20" height="20"/>
    <rect class="grass1" x="50" y="25" width="20" height="20"/>
    <rect class="grass2" x="75" y="25" width="20" height="20"/>

    <rect class="grass3" x="0" y="50" width="20" height="20"/>
    <rect class="grass1" x="25" y="50" width="20" height="20"/>
    <rect class="grass2" x="50" y="50" width="20" height="20"/>
    <rect class="grass3" x="75" y="50" width="20" height="20"/>

    <text
      x="-10"
      y="110"
      font-family="monospace"
      font-size="14"
      fill="#FFD54F">
      GitHub Grass → Tamagoyaki
    </text>

  </g>

</svg>