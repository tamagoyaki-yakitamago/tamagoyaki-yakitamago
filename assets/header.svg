<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="100%"
  viewBox="0 0 1200 300">

  <defs>
    <style>
      .pixel {
        shape-rendering: crispEdges;
      }

      .title {
        font-family: monospace;
        font-size: 48px;
        fill: #FFD54F;
        font-weight: bold;
      }

      .subtitle {
        font-family: monospace;
        font-size: 20px;
        fill: #E0E0E0;
      }

      .panel-text {
        font-family: monospace;
        font-size: 14px;
        fill: #E0E0E0;
      }

      .arm {
        transform-origin: 165px 145px;
        animation: cook 1.2s infinite alternate;
      }

      .omelet {
        animation: flip 1.2s infinite;
      }

      .steam1 {
        animation: steam 2s infinite;
      }

      .steam2 {
        animation: steam 2s infinite .6s;
      }

      .steam3 {
        animation: steam 2s infinite 1.2s;
      }

      .grass1 {
        animation: toast 4s infinite;
      }

      .grass2 {
        animation: toast 4s infinite 1s;
      }

      .grass3 {
        animation: toast 4s infinite 2s;
      }

      @keyframes cook {
        from { transform: rotate(-6deg); }
        to   { transform: rotate(10deg); }
      }

      @keyframes flip {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-35px);
        }
        100% {
          transform: translateY(0);
        }
      }

      @keyframes steam {
        0% {
          opacity: 0;
          transform: translateY(0);
        }

        50% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translateY(-25px);
        }
      }

      @keyframes toast {
        0%,55% {
          fill: #2ea043;
        }

        65%,100% {
          fill: #FFD54F;
        }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="#0d1117"/>

  <!-- stars -->
  <circle cx="60" cy="40" r="2" fill="#ffffff"/>
  <circle cx="250" cy="20" r="2" fill="#ffffff"/>
  <circle cx="900" cy="40" r="2" fill="#ffffff"/>
  <circle cx="1100" cy="60" r="2" fill="#ffffff"/>

  <!-- title -->
  <text x="50%" y="95" class="title" text-anchor="middle">
    tamagoyaki-yakitamago
  </text>

  <text x="50%" y="130" class="subtitle" text-anchor="middle">
    Security Engineer | AppSec | AWS | Python | Go
  </text>

  <!-- RPG Panel -->
  <rect
    x="400"
    y="165"
    width="320"
    height="90"
    rx="8"
    fill="#161b22"
    stroke="#30363d"/>

  <text x="425" y="190" class="panel-text">
    CLASS : SECURITY ENGINEER
  </text>

  <text x="425" y="210" class="panel-text">
    LV    : 0
  </text>

  <text x="425" y="230" class="panel-text">
    MAIN  : APPSEC
  </text>

  <text x="425" y="250" class="panel-text">
    WEAPON: FRYING PAN + BURP
  </text>

  <!-- contribution grid -->
  <g transform="translate(60, 90)">

    <rect class="grass1" x="0" y="0" width="20" height="20"/>
    <rect class="grass2" x="25" y="0" width="20" height="20"/>
    <rect class="grass3" x="50" y="0" width="20" height="20"/>
    <rect class="grass1" x="75" y="0" width="20" height="20"/>

    <rect class="grass2" x="0" y="25" width="20" height="20"/>
    <rect class="grass3" x="25" y="25" width="20" height="20"/>
    <rect class="grass1" x="50" y="25" width="20" height="20"/>
    <rect class="grass2" x="75" y="25" width="20" height="20"/>

    <rect class="grass3" x="0" y="50" width="20" height="20"/>
    <rect class="grass1" x="25" y="50" width="20" height="20"/>
    <rect class="grass2" x="50" y="50" width="20" height="20"/>
    <rect class="grass3" x="75" y="50" width="20" height="20"/>

    <text
      x="-10"
      y="110"
      font-family="monospace"
      font-size="14"
      fill="#FFD54F">
      GitHub Grass
    </text>
    <text
      x="45"
      y="130"
      font-family="monospace"
      font-size="14"
      fill="#FFD54F">
       ↓ 
    </text>
    <text
      x="-30"
      y="150"
      font-family="monospace"
      font-size="14"
      fill="#FFD54F">
      tamagoyaki-yakitamago
    </text>

  </g>

  <!-- chef -->
  <image
    href="chef.png"
    x="900"
    y="25"
    width="256"
    height="256" />

</svg>